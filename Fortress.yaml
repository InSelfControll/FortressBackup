# FortressBackup production Compose stack.
# Accessible only through localhost or an explicitly configured TLS proxy.
name: fortressbackup

services:
  fortress:
    build:
      context: .
      dockerfile: Dockerfile
    image: fortressbackup:local
    init: true
    user: "1001:1001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:9001:9001"
    environment:
      NODE_ENV: production
      PORT: "9001"
      FRONTEND_URL: ${FORTRESS_FRONTEND_URL:-http://localhost:9001}
      FORTRESS_BOOTSTRAP_TOKEN: ${FORTRESS_BOOTSTRAP_TOKEN:?Set a random 32+ character bootstrap token in a private environment file}
    volumes:
      - fortress-data:/app/data
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  fortress-data:
