name: Windows backup agent
on:
  push:
    paths:
      - 'agent/windows/**'
      - '.github/workflows/windows-agent.yml'
  pull_request:
    paths:
      - 'agent/windows/**'
      - '.github/workflows/windows-agent.yml'
permissions:
  contents: read
jobs:
  test-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/windows/go.mod
          cache: false
      - name: Go tests
        working-directory: agent/windows
        run: go test -v ./...
      - name: Go vet
        working-directory: agent/windows
        run: go vet ./...
      - name: Build executable
        working-directory: agent/windows
        run: go build -trimpath -o fortress-agent.exe .
      - name: Validate managed scheduled task
        shell: pwsh
        run: |
          $cfg = Join-Path $env:RUNNER_TEMP 'agent-config.json'
          Set-Content -LiteralPath $cfg -Value '{}' -Encoding utf8
          try {
            & ./agent/windows/install-task.ps1 -AgentPath ./agent/windows/fortress-agent.exe -ConfigPath $cfg -TaskName FortressBackup-CITest -Managed
            $task = Get-ScheduledTask -TaskName FortressBackup-CITest -ErrorAction Stop
            if (-not $task) { throw 'Task not registered' }
          } finally {
            Unregister-ScheduledTask -TaskName FortressBackup-CITest -Confirm:$false -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: fortress-agent-windows-amd64
          path: agent/windows/fortress-agent.exe
          if-no-files-found: error
