name: Windows backup agent
on:
  push:
    paths:
      - 'agent/windows/**'
      - '.github/workflows/windows-agent.yml'
  pull_request:
    paths:
      - 'agent/windows/**'
      - '.github/workflows/windows-agent.yml'
permissions:
  contents: read
jobs:
  test-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: agent/windows/go.mod
          cache: false
      - name: Go tests
        working-directory: agent/windows
        run: go test -v ./...
      - name: Go vet
        working-directory: agent/windows
        run: go vet ./...
      - name: Build executable
        working-directory: agent/windows
        run: go build -trimpath -o fortress-agent.exe .
      - name: Validate protected managed scheduled task
        shell: pwsh
        run: |
          $exe = (Resolve-Path ./agent/windows/fortress-agent.exe).Path
          $cfg = Join-Path $env:RUNNER_TEMP 'agent-config.json'
          $pw = Join-Path $env:RUNNER_TEMP 'repo-password.txt'
          $token = Join-Path $env:RUNNER_TEMP 'agent-token.txt'
          Set-Content -LiteralPath $pw -Value 'test-only' -Encoding ascii
          Set-Content -LiteralPath $token -Value 'test-only' -Encoding ascii
          @{resticPath=$exe;passwordFile=$pw;agentTokenFile=$token;repository='sftp:example:repo';sources=@('C:\\Windows')} |
            ConvertTo-Json | Set-Content -LiteralPath $cfg -Encoding utf8
          $digest = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash
          try {
            & ./agent/windows/install-task.ps1 -AgentPath $exe -ConfigPath $cfg -AgentSha256 $digest -ResticSha256 $digest -TaskName FortressBackup-CITest -Managed
            $task = Get-ScheduledTask -TaskName FortressBackup-CITest -ErrorAction Stop
            if (-not $task) { throw 'Task not registered' }
          } finally {
            Unregister-ScheduledTask -TaskName FortressBackup-CITest -Confirm:$false -ErrorAction SilentlyContinue
          }
      - name: Verify Windows VSS snapshot and full Restic restore
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install restic --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Restic bootstrap failed' }
          $bootstrap = (Get-Command restic -ErrorAction Stop).Source
          $restic = Join-Path $env:RUNNER_TEMP 'restic-stable.exe'
          & $bootstrap self-update --output $restic
          if ($LASTEXITCODE -ne 0) { throw 'Signed Restic self-update failed' }
          if (-not (Test-Path -LiteralPath $restic)) { $restic = $bootstrap }
          $root = Join-Path $env:RUNNER_TEMP 'fortress-vss-smoke'
          $source = Join-Path $root 'source'
          $repo = Join-Path $root 'repository'
          $restore = Join-Path $root 'restore'
          $pass = Join-Path $root 'password'
          New-Item -ItemType Directory -Path $source -Force | Out-Null
          $password = [Convert]::ToHexString([Security.Cryptography.RandomNumberGenerator]::GetBytes(32))
          [IO.File]::WriteAllText($pass, $password)
          $file = Join-Path $source 'test-record.txt'
          [IO.File]::WriteAllText($file, 'FortressBackup Windows VSS restore verification')
          & $restic --repo $repo --password-file $pass init
          if ($LASTEXITCODE -ne 0) { throw 'Repository init failed' }
          & $restic --repo $repo --password-file $pass backup --use-fs-snapshot -- $source
          if ($LASTEXITCODE -ne 0) { throw 'VSS backup failed' }
          & $restic --repo $repo --password-file $pass check
          if ($LASTEXITCODE -ne 0) { throw 'Windows repository integrity check failed' }
          & $restic --repo $repo --password-file $pass restore latest --target $restore
          if ($LASTEXITCODE -ne 0) { throw 'Windows restore failed' }
          $recovered = Get-ChildItem -LiteralPath $restore -Recurse -File -Filter 'test-record.txt' | Select-Object -First 1
          if (-not $recovered) { throw 'Restored file is missing' }
          if ((Get-FileHash $file -Algorithm SHA256).Hash -ne (Get-FileHash $recovered.FullName -Algorithm SHA256).Hash) {
            throw 'Restored file does not match original'
          }
          Write-Output 'Windows VSS backup and restore verified'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fortress-agent-windows-amd64
          path: agent/windows/fortress-agent.exe
          if-no-files-found: error
