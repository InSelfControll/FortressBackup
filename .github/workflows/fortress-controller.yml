name: Fortress controller
on:
  push:
    paths:
      - 'server/**'
      - 'tests/**'
      - 'components/**'
      - 'App.tsx'
      - 'types.ts'
      - 'client/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/fortress-controller.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'components/**'
      - 'App.tsx'
      - 'types.ts'
      - 'client/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/fortress-controller.yml'
permissions:
  contents: read
jobs:
  repair-dependencies:
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/fortress-restic-hardening'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: fortress-dependency-repair
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - name: Update vulnerable locked dependencies
        run: |
          bun install --frozen-lockfile
          bun audit fix --latest || bun update --latest
          bun audit --audit-level=high
          bun test tests/managed-agents.test.ts tests/security.test.ts
          bunx tsc --noEmit
          bun run build
      - name: Commit validated dependency updates
        run: |
          git add -- package.json bun.lock
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(deps): resolve critical and high advisories"
          git push origin HEAD:fix/fortress-restic-hardening
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Audit dependency vulnerabilities
        run: bun audit --audit-level=high
      - name: Managed-agent integration test
        run: bun test tests/managed-agents.test.ts tests/security.test.ts
      - name: Type-check
        run: bunx tsc --noEmit
      - name: Build frontend
        run: bun run build
