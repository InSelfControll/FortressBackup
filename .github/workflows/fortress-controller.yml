name: Fortress controller
on:
  push:
    paths:
      - 'server/**'
      - 'tests/**'
      - 'components/**'
      - 'App.tsx'
      - 'types.ts'
      - 'client/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/fortress-controller.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'components/**'
      - 'App.tsx'
      - 'types.ts'
      - 'client/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/fortress-controller.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Managed-agent integration test
        run: bun test tests/managed-agents.test.ts
      - name: Type-check
        run: bunx tsc --noEmit
      - name: Build frontend
        run: bun run build
